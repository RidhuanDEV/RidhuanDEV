name: Update Language Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/lang_stats.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate languages.svg
        env:
          # Opsional: buat secret GH_PAT (scope: repo) agar repo private ikut dihitung
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          # "owner" = repo milikmu saja. Ganti ke "owner,collaborator,organization_member"
          # (butuh GH_PAT) untuk ikut menghitung repo organisasi/kolaborasi.
          AFFILIATION: owner
          EXCLUDE: HTML,CSS,Blade,Dockerfile
          TOP_N: "12"
        run: python scripts/lang_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git diff --staged --quiet || (git commit -m "chore: update language stats" && git push)
